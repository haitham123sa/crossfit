name: Generate H-FORGE Meta app icon (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-icon-1024.yml'

permissions:
  contents: write

jobs:
  make-meta-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public H-FORGE repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Create 1024px Meta icon from existing H-FORGE brand icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          source = Image.open("assets/icon-512.png").convert("RGBA")
          assert source.size == (512,512), source.size
          source.resize((1024,1024), Image.Resampling.LANCZOS).save("assets/meta-icon-1024.png", optimize=True)
          final = Image.open("assets/meta-icon-1024.png")
          assert final.size == (1024,1024)
          print("Prepared Meta app icon:", final.size)
          PY
      - name: Commit resized branded icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/meta-icon-1024.png
          if git diff --cached --quiet; then
            echo "Icon already up to date."
          else
            git commit -m "Add 1024px H-FORGE brand icon for Meta developer app"
            git push
          fi
